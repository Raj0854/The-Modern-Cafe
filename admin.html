<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Dashboard - Modern Café</title>
  <link rel="icon" type="image/x-icon" href="img/logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { min-height: 100vh; background: #171717; color: #f0e6d2; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .navbar, .panel { background: #202020; }
    .text-cafe { color: #f5c518; }
    .btn-cafe { background: #d4a017; border-color: #d4a017; color: #000; font-weight: 700; }
    .btn-cafe:hover { background: #f5c518; border-color: #f5c518; color: #000; }
    .form-control, .form-select { background-color: #292929; border-color: #555; color: #fff; }
    .form-control:focus, .form-select:focus { background-color: #292929; color: #fff; }
    .table { --bs-table-bg: transparent; --bs-table-color: #f0e6d2; --bs-table-border-color: #444; }
    .panel { border-radius: 12px; padding: 1.25rem; }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark mb-4">
    <div class="container d-flex justify-content-between">
      <a class="navbar-brand text-cafe fw-bold" href="index.html">MODERN CAFÉ · ADMIN</a>
      <button id="logout-button" class="btn btn-outline-light d-none" type="button">Sign out</button>
    </div>
  </nav>
  <main class="container pb-5">
    <div id="notice" class="mb-3" role="status" aria-live="polite"></div>
    <section id="login-panel" class="panel mx-auto" style="max-width: 28rem;">
      <h1 class="h3 text-cafe mb-3">Administrator Login</h1>
      <form id="login-form">
        <label for="admin-password" class="form-label">Password</label>
        <input id="admin-password" class="form-control mb-3" type="password" autocomplete="current-password" required>
        <button class="btn btn-cafe w-100" type="submit">Sign in</button>
      </form>
    </section>
    <section id="dashboard" class="d-none">
      <h1 class="h2 text-cafe mb-4">Cafe Dashboard</h1>
      <div id="metrics" class="row g-3 mb-4"></div>
      <div class="row g-4">
        <section class="col-xl-7">
          <div class="panel h-100">
            <h2 class="h4 text-cafe">Recent Orders</h2>
            <div class="table-responsive">
              <table class="table align-middle">
                <thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th></tr></thead>
                <tbody id="orders-table"></tbody>
              </table>
            </div>
          </div>
        </section>
        <section class="col-xl-5">
          <div class="panel">
            <h2 class="h4 text-cafe">Product Management</h2>
            <form id="product-form" class="row g-2 mb-4">
              <input id="product-id" type="hidden">
              <div class="col-12"><label class="form-label" for="product-name">Name</label><input id="product-name" class="form-control" maxlength="100" required></div>
              <div class="col-12"><label class="form-label" for="product-description">Description</label><textarea id="product-description" class="form-control" maxlength="500" required></textarea></div>
              <div class="col-6"><label class="form-label" for="product-price">Price (₹)</label><input id="product-price" class="form-control" type="number" min="0" max="1000000" step="1" required></div>
              <div class="col-6"><label class="form-label" for="product-stock">Stock</label><input id="product-stock" class="form-control" type="number" min="0" max="1000000" step="1" required></div>
              <div class="col-6"><label class="form-label" for="product-category">Category</label><select id="product-category" class="form-select"><option value="coffee">Coffee</option><option value="breakfast">Breakfast</option><option value="desserts">Desserts</option></select></div>
              <div class="col-6"><label class="form-label" for="product-image">Image path</label><input id="product-image" class="form-control" value="img/espresso.png" required></div>
              <div class="col-12 form-check ms-2"><input id="product-available" class="form-check-input" type="checkbox" checked><label class="form-check-label" for="product-available">Available to order</label></div>
              <div class="col-12 d-flex gap-2">
                <button class="btn btn-cafe" type="submit">Save Product</button>
                <button id="cancel-edit" class="btn btn-outline-light" type="button">Clear</button>
              </div>
            </form>
            <div class="table-responsive">
              <table class="table align-middle">
                <thead><tr><th>Product</th><th>Price</th><th>Stock</th><th></th></tr></thead>
                <tbody id="products-table"></tbody>
              </table>
            </div>
          </div>
        </section>
      </div>
    </section>
  </main>
  <script src="admin.js"></script>
</body>
</html>
